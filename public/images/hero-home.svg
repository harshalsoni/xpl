<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="hh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="50%" stop-color="#283238"/>
      <stop offset="100%" stop-color="#1C2428"/>
    </linearGradient>
    <linearGradient id="hh-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hh-hill1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#283238" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="hh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hh-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="100%" stop-color="#283238"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1920" height="600" fill="url(#hh-sky)"/>

  <!-- Stars -->
  <circle cx="150" cy="60" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="90" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="500" cy="40" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="700" cy="80" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="900" cy="50" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1100" cy="70" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="1300" cy="35" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="1500" cy="95" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="1700" cy="55" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="1850" cy="75" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="250" cy="130" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="600" cy="120" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="1000" cy="110" r="1" fill="#ffffff" opacity="0.25"/>
  <circle cx="1400" cy="140" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="1600" cy="125" r="1" fill="#ffffff" opacity="0.3"/>

  <!-- Large glow behind center -->
  <ellipse cx="960" cy="350" rx="600" ry="300" fill="url(#hh-glow)"/>

  <!-- Connectivity grid lines -->
  <line x1="0" y1="200" x2="1920" y2="200" stroke="#00FF57" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="250" x2="1920" y2="250" stroke="#00FF57" stroke-width="0.5" opacity="0.06"/>
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#00FF57" stroke-width="0.5" opacity="0.04"/>
  <line x1="480" y1="0" x2="480" y2="600" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>
  <line x1="1440" y1="0" x2="1440" y2="600" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>

  <!-- Signal waves from tower -->
  <circle cx="1400" cy="280" r="40" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.15"/>
  <circle cx="1400" cy="280" r="80" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.1"/>
  <circle cx="1400" cy="280" r="120" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.07"/>
  <circle cx="1400" cy="280" r="160" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>

  <!-- Cell tower -->
  <rect x="1396" y="260" width="8" height="140" fill="#00FF57" opacity="0.5"/>
  <rect x="1388" y="270" width="24" height="3" fill="#00FF57" opacity="0.4"/>
  <rect x="1391" y="285" width="18" height="3" fill="#00FF57" opacity="0.35"/>
  <rect x="1394" y="300" width="12" height="3" fill="#00FF57" opacity="0.3"/>
  <circle cx="1400" cy="258" r="4" fill="#00FF57" opacity="0.6"/>

  <!-- Rolling hills - back layer -->
  <path d="M0,480 Q200,380 400,420 Q600,460 800,400 Q1000,340 1200,390 Q1400,440 1600,380 Q1800,320 1920,370 L1920,600 L0,600 Z" fill="#283238" opacity="0.6"/>

  <!-- Rolling hills - mid layer -->
  <path d="M0,500 Q150,440 350,460 Q550,480 750,440 Q950,400 1150,450 Q1350,500 1550,430 Q1750,360 1920,410 L1920,600 L0,600 Z" fill="url(#hh-hill1)" opacity="0.5"/>

  <!-- Rolling hills - front layer -->
  <path d="M0,520 Q250,470 500,490 Q750,510 1000,480 Q1250,450 1500,500 Q1750,540 1920,500 L1920,600 L0,600 Z" fill="#283238" opacity="0.8"/>

  <!-- Houses on hills -->
  <!-- House 1 -->
  <rect x="300" y="468" width="30" height="25" fill="#1C2428" opacity="0.9"/>
  <polygon points="295,468 315,450 335,468" fill="#1C2428" opacity="0.9"/>
  <rect x="310" y="478" width="8" height="15" fill="#00FF57" opacity="0.3"/>
  <rect x="303" y="474" width="6" height="6" fill="#00FF57" opacity="0.2"/>

  <!-- House 2 -->
  <rect x="700" y="438" width="35" height="28" fill="#1C2428" opacity="0.9"/>
  <polygon points="694,438 717,416 740,438" fill="#1C2428" opacity="0.9"/>
  <rect x="712" y="450" width="9" height="16" fill="#00FF57" opacity="0.3"/>
  <rect x="703" y="444" width="7" height="7" fill="#00FF57" opacity="0.2"/>

  <!-- House 3 -->
  <rect x="1050" y="455" width="28" height="22" fill="#1C2428" opacity="0.9"/>
  <polygon points="1045,455 1064,438 1083,455" fill="#1C2428" opacity="0.9"/>
  <rect x="1059" y="462" width="8" height="15" fill="#00FF57" opacity="0.3"/>

  <!-- Trees scattered -->
  <ellipse cx="200" cy="495" rx="15" ry="25" fill="#283238" opacity="0.7"/>
  <rect x="198" y="510" width="4" height="15" fill="#283238" opacity="0.6"/>
  <ellipse cx="550" cy="480" rx="12" ry="20" fill="#283238" opacity="0.7"/>
  <rect x="548" y="495" width="4" height="12" fill="#283238" opacity="0.6"/>
  <ellipse cx="850" cy="450" rx="14" ry="22" fill="#283238" opacity="0.7"/>
  <rect x="848" y="467" width="4" height="13" fill="#283238" opacity="0.6"/>
  <ellipse cx="1200" cy="470" rx="13" ry="21" fill="#283238" opacity="0.7"/>
  <rect x="1198" y="486" width="4" height="12" fill="#283238" opacity="0.6"/>

  <!-- Connection dots/nodes -->
  <circle cx="300" cy="300" r="4" fill="#00FF57" opacity="0.4"/>
  <circle cx="500" cy="260" r="3" fill="#00FF57" opacity="0.3"/>
  <circle cx="700" cy="310" r="4" fill="#00FF57" opacity="0.35"/>
  <circle cx="960" cy="240" r="5" fill="#00FF57" opacity="0.4"/>
  <circle cx="1200" cy="290" r="3" fill="#00FF57" opacity="0.3"/>

  <!-- Connection lines between nodes -->
  <line x1="300" y1="300" x2="500" y2="260" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>
  <line x1="500" y1="260" x2="700" y2="310" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>
  <line x1="700" y1="310" x2="960" y2="240" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>
  <line x1="960" y1="240" x2="1200" y2="290" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>
  <line x1="1200" y1="290" x2="1400" y2="280" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>

  <!-- Decorative diagonal streaks -->
  <line x1="100" y1="0" x2="250" y2="600" stroke="#00FF57" stroke-width="1" opacity="0.03"/>
  <line x1="400" y1="0" x2="550" y2="600" stroke="#00FF57" stroke-width="1" opacity="0.03"/>
  <line x1="1500" y1="0" x2="1650" y2="600" stroke="#00FF57" stroke-width="1" opacity="0.03"/>
  <line x1="1700" y1="0" x2="1850" y2="600" stroke="#00FF57" stroke-width="1" opacity="0.03"/>

  <!-- Bottom gradient overlay -->
  <rect x="0" y="500" width="1920" height="100" fill="url(#hh-green)" opacity="0.1"/>
</svg>
