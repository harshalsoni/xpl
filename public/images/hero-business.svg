<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bz-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="100%" stop-color="#283238"/>
    </linearGradient>
    <linearGradient id="bz-bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283238"/>
      <stop offset="100%" stop-color="#1C2428"/>
    </linearGradient>
    <radialGradient id="bz-glow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="600" fill="url(#bz-bg)"/>
  <rect width="1920" height="600" fill="url(#bz-glow)"/>

  <!-- Grid pattern background -->
  <line x1="0" y1="100" x2="1920" y2="100" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="200" x2="1920" y2="200" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="400" x2="1920" y2="400" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="0" y1="500" x2="1920" y2="500" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="320" y1="0" x2="320" y2="600" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="640" y1="0" x2="640" y2="600" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="960" y1="0" x2="960" y2="600" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="1280" y1="0" x2="1280" y2="600" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>
  <line x1="1600" y1="0" x2="1600" y2="600" stroke="#00FF57" stroke-width="0.3" opacity="0.05"/>

  <!-- City skyline - back layer -->
  <!-- Tall building 1 -->
  <rect x="100" y="200" width="80" height="400" fill="url(#bz-bldg)" opacity="0.4"/>
  <rect x="110" y="220" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="130" y="220" width="12" height="12" fill="#00FF57" opacity="0.08"/>
  <rect x="155" y="220" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="110" y="250" width="12" height="12" fill="#00FF57" opacity="0.08"/>
  <rect x="130" y="250" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="155" y="250" width="12" height="12" fill="#00FF57" opacity="0.06"/>
  <rect x="110" y="280" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="130" y="280" width="12" height="12" fill="#00FF57" opacity="0.06"/>
  <rect x="155" y="280" width="12" height="12" fill="#00FF57" opacity="0.1"/>

  <!-- Building 2 -->
  <rect x="200" y="280" width="70" height="320" fill="url(#bz-bldg)" opacity="0.35"/>
  <rect x="210" y="295" width="10" height="10" fill="#00FF57" opacity="0.08"/>
  <rect x="230" y="295" width="10" height="10" fill="#00FF57" opacity="0.1"/>
  <rect x="250" y="295" width="10" height="10" fill="#00FF57" opacity="0.06"/>
  <rect x="210" y="320" width="10" height="10" fill="#00FF57" opacity="0.1"/>
  <rect x="230" y="320" width="10" height="10" fill="#00FF57" opacity="0.06"/>
  <rect x="250" y="320" width="10" height="10" fill="#00FF57" opacity="0.08"/>

  <!-- Building 3 - tallest -->
  <rect x="300" y="150" width="90" height="450" fill="url(#bz-bldg)" opacity="0.45"/>
  <rect x="310" y="170" width="14" height="14" fill="#00FF57" opacity="0.1"/>
  <rect x="335" y="170" width="14" height="14" fill="#00FF57" opacity="0.08"/>
  <rect x="360" y="170" width="14" height="14" fill="#00FF57" opacity="0.1"/>
  <rect x="310" y="200" width="14" height="14" fill="#00FF57" opacity="0.06"/>
  <rect x="335" y="200" width="14" height="14" fill="#00FF57" opacity="0.1"/>
  <rect x="360" y="200" width="14" height="14" fill="#00FF57" opacity="0.08"/>
  <rect x="310" y="230" width="14" height="14" fill="#00FF57" opacity="0.1"/>
  <rect x="335" y="230" width="14" height="14" fill="#00FF57" opacity="0.06"/>
  <rect x="360" y="230" width="14" height="14" fill="#00FF57" opacity="0.1"/>

  <!-- Building 4 -->
  <rect x="420" y="250" width="65" height="350" fill="url(#bz-bldg)" opacity="0.38"/>

  <!-- Right side buildings -->
  <rect x="1500" y="220" width="85" height="380" fill="url(#bz-bldg)" opacity="0.42"/>
  <rect x="1510" y="240" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1535" y="240" width="12" height="12" fill="#00FF57" opacity="0.08"/>
  <rect x="1560" y="240" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1510" y="270" width="12" height="12" fill="#00FF57" opacity="0.08"/>
  <rect x="1535" y="270" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1560" y="270" width="12" height="12" fill="#00FF57" opacity="0.06"/>

  <rect x="1610" y="180" width="80" height="420" fill="url(#bz-bldg)" opacity="0.45"/>
  <rect x="1620" y="200" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1645" y="200" width="12" height="12" fill="#00FF57" opacity="0.06"/>
  <rect x="1668" y="200" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1620" y="230" width="12" height="12" fill="#00FF57" opacity="0.06"/>
  <rect x="1645" y="230" width="12" height="12" fill="#00FF57" opacity="0.1"/>
  <rect x="1668" y="230" width="12" height="12" fill="#00FF57" opacity="0.08"/>

  <rect x="1720" y="260" width="70" height="340" fill="url(#bz-bldg)" opacity="0.38"/>
  <rect x="1810" y="300" width="110" height="300" fill="url(#bz-bldg)" opacity="0.35"/>

  <!-- Growth chart -->
  <polyline points="800,400 850,380 900,390 950,350 1000,340 1050,300 1100,280 1150,250" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.25"/>
  <circle cx="800" cy="400" r="3" fill="#00FF57" opacity="0.35"/>
  <circle cx="900" cy="390" r="3" fill="#00FF57" opacity="0.35"/>
  <circle cx="1000" cy="340" r="3" fill="#00FF57" opacity="0.35"/>
  <circle cx="1100" cy="280" r="3" fill="#00FF57" opacity="0.35"/>
  <circle cx="1150" cy="250" r="4" fill="#00FF57" opacity="0.4"/>
  <!-- Chart arrow -->
  <polygon points="1150,245 1165,250 1155,260" fill="#00FF57" opacity="0.3"/>

  <!-- Briefcase icon -->
  <rect x="920" y="440" width="50" height="35" rx="3" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.2"/>
  <rect x="935" y="432" width="20" height="10" rx="2" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.2"/>
  <line x1="920" y1="452" x2="970" y2="452" stroke="#00FF57" stroke-width="0.8" opacity="0.15"/>

  <!-- Network nodes -->
  <circle cx="750" cy="200" r="4" fill="#00FF57" opacity="0.3"/>
  <circle cx="1200" cy="180" r="4" fill="#00FF57" opacity="0.3"/>
  <circle cx="960" cy="150" r="5" fill="#00FF57" opacity="0.35"/>
  <line x1="750" y1="200" x2="960" y2="150" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>
  <line x1="960" y1="150" x2="1200" y2="180" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>

  <!-- Ground line -->
  <rect x="0" y="595" width="1920" height="5" fill="#00FF57" opacity="0.06"/>
</svg>
