<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="xc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="100%" stop-color="#283238"/>
    </linearGradient>
    <radialGradient id="xc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="600" fill="url(#xc-bg)"/>
  <ellipse cx="960" cy="300" rx="500" ry="350" fill="url(#xc-glow)"/>

  <!-- Shield icon - center -->
  <path d="M960,140 L1060,190 L1060,320 Q1060,420 960,460 Q860,420 860,320 L860,190 Z" fill="none" stroke="#00FF57" stroke-width="3" opacity="0.35"/>
  <path d="M960,160 L1040,200 L1040,315 Q1040,400 960,435 Q880,400 880,315 L880,200 Z" fill="#00FF57" opacity="0.04"/>

  <!-- Checkmark inside shield -->
  <polyline points="920,290 945,320 1010,250" fill="none" stroke="#00FF57" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Shield glow ring -->
  <circle cx="960" cy="300" r="180" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.08" stroke-dasharray="8 4"/>
  <circle cx="960" cy="300" r="220" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.05" stroke-dasharray="10 6"/>

  <!-- Wrench icon - left -->
  <g transform="translate(450, 280) rotate(-45)" opacity="0.25">
    <rect x="-5" y="-40" width="10" height="60" rx="2" fill="#00FF57"/>
    <circle cx="0" cy="-45" r="12" fill="none" stroke="#00FF57" stroke-width="3"/>
    <rect x="-3" y="-57" width="6" height="10" fill="#283238"/>
  </g>

  <!-- Screwdriver icon - left bottom -->
  <g transform="translate(550, 380) rotate(30)" opacity="0.2">
    <rect x="-3" y="-35" width="6" height="50" rx="1" fill="#00FF57"/>
    <polygon points="-6,-35 6,-35 3,-50 -3,-50" fill="#00FF57" opacity="0.8"/>
    <rect x="-6" y="12" width="12" height="5" rx="1" fill="#00FF57"/>
  </g>

  <!-- Gear icon - right -->
  <g transform="translate(1450, 260)" opacity="0.2">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00FF57" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00FF57" stroke-width="2"/>
    <!-- Gear teeth -->
    <rect x="-4" y="-32" width="8" height="12" fill="#00FF57"/>
    <rect x="-4" y="20" width="8" height="12" fill="#00FF57"/>
    <rect x="-32" y="-4" width="12" height="8" fill="#00FF57"/>
    <rect x="20" y="-4" width="12" height="8" fill="#00FF57"/>
    <rect x="15" y="-25" width="8" height="12" fill="#00FF57" transform="rotate(45 19 -19)"/>
    <rect x="-23" y="13" width="8" height="12" fill="#00FF57" transform="rotate(45 -19 19)"/>
    <rect x="13" y="15" width="8" height="12" fill="#00FF57" transform="rotate(-45 17 21)"/>
    <rect x="-21" y="-23" width="8" height="12" fill="#00FF57" transform="rotate(-45 -17 -17)"/>
  </g>

  <!-- Second gear - smaller -->
  <g transform="translate(1520, 340)" opacity="0.15">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00FF57" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00FF57" stroke-width="1.5"/>
    <rect x="-3" y="-22" width="6" height="10" fill="#00FF57"/>
    <rect x="-3" y="12" width="6" height="10" fill="#00FF57"/>
    <rect x="-22" y="-3" width="10" height="6" fill="#00FF57"/>
    <rect x="12" y="-3" width="10" height="6" fill="#00FF57"/>
  </g>

  <!-- Protection circles/barriers -->
  <circle cx="960" cy="300" r="260" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.06"/>

  <!-- Small shield icons scattered -->
  <path d="M300,200 L325,210 L325,240 Q325,260 300,270 Q275,260 275,240 L275,210 Z" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.15"/>
  <path d="M1620,330 L1645,340 L1645,370 Q1645,390 1620,400 Q1595,390 1595,370 L1595,340 Z" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.15"/>

  <!-- Safety/assurance stars -->
  <path d="M700,180 L705,168 L710,180 L722,183 L710,188 L705,200 L700,188 L688,183 Z" fill="#00FF57" opacity="0.2"/>
  <path d="M1250,200 L1254,190 L1258,200 L1268,204 L1258,208 L1254,218 L1250,208 L1240,204 Z" fill="#00FF57" opacity="0.18"/>
  <path d="M200,350 L204,342 L208,350 L216,353 L208,356 L204,364 L200,356 L192,353 Z" fill="#ffffff" opacity="0.15"/>
  <path d="M1700,230 L1703,224 L1706,230 L1712,232 L1706,234 L1703,240 L1700,234 L1694,232 Z" fill="#ffffff" opacity="0.12"/>

  <!-- Lock icon - bottom -->
  <g transform="translate(960, 510)" opacity="0.15">
    <rect x="-15" y="0" width="30" height="22" rx="3" fill="none" stroke="#00FF57" stroke-width="1.5"/>
    <path d="M-8,0 L-8,-10 Q-8,-20 0,-20 Q8,-20 8,-10 L8,0" fill="none" stroke="#00FF57" stroke-width="1.5"/>
    <circle cx="0" cy="10" r="3" fill="#00FF57" opacity="0.5"/>
  </g>

  <!-- Decorative lines -->
  <line x1="100" y1="500" x2="400" y2="500" stroke="#00FF57" stroke-width="1" opacity="0.06"/>
  <line x1="1520" y1="500" x2="1820" y2="500" stroke="#00FF57" stroke-width="1" opacity="0.06"/>

  <!-- Floating dots -->
  <circle cx="150" cy="150" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="350" cy="100" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="600" cy="120" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="1350" cy="130" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="1550" cy="150" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="1780" cy="120" r="1.5" fill="#ffffff" opacity="0.15"/>
  <circle cx="250" cy="450" r="2" fill="#00FF57" opacity="0.18"/>
  <circle cx="1680" cy="460" r="2" fill="#00FF57" opacity="0.18"/>
</svg>
