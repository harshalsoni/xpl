<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="fb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="100%" stop-color="#283238"/>
    </linearGradient>
    <linearGradient id="fb-strand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00FF57" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00FF57" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fb-strand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#00FF57" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
    <filter id="fb-blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1920" height="600" fill="url(#fb-bg)"/>
  <ellipse cx="960" cy="300" rx="700" ry="400" fill="url(#fb-glow)"/>

  <!-- Fibre strands - flowing curves across -->
  <path d="M0,200 Q300,150 600,250 Q900,350 1200,200 Q1500,50 1920,180" fill="none" stroke="url(#fb-strand1)" stroke-width="3" opacity="0.6"/>
  <path d="M0,220 Q300,170 600,270 Q900,370 1200,220 Q1500,70 1920,200" fill="none" stroke="url(#fb-strand1)" stroke-width="2" opacity="0.4"/>
  <path d="M0,240 Q300,190 600,290 Q900,390 1200,240 Q1500,90 1920,220" fill="none" stroke="url(#fb-strand2)" stroke-width="1.5" opacity="0.3"/>

  <path d="M0,350 Q400,300 700,400 Q1000,500 1300,350 Q1600,200 1920,320" fill="none" stroke="url(#fb-strand1)" stroke-width="3" opacity="0.5"/>
  <path d="M0,370 Q400,320 700,420 Q1000,520 1300,370 Q1600,220 1920,340" fill="none" stroke="url(#fb-strand2)" stroke-width="2" opacity="0.35"/>
  <path d="M0,390 Q400,340 700,440 Q1000,540 1300,390 Q1600,240 1920,360" fill="none" stroke="url(#fb-strand1)" stroke-width="1.5" opacity="0.25"/>

  <path d="M0,480 Q500,430 800,500 Q1100,570 1400,460 Q1700,350 1920,450" fill="none" stroke="url(#fb-strand2)" stroke-width="2.5" opacity="0.4"/>
  <path d="M0,500 Q500,450 800,520 Q1100,590 1400,480 Q1700,370 1920,470" fill="none" stroke="url(#fb-strand1)" stroke-width="1.5" opacity="0.3"/>

  <!-- Light data pulses traveling along strands -->
  <circle cx="450" cy="210" r="6" fill="#00FF57" opacity="0.7" filter="url(#fb-blur)"/>
  <circle cx="450" cy="210" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="900" cy="340" r="6" fill="#00FF57" opacity="0.6" filter="url(#fb-blur)"/>
  <circle cx="900" cy="340" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="1350" cy="190" r="6" fill="#00FF57" opacity="0.5" filter="url(#fb-blur)"/>
  <circle cx="1350" cy="190" r="3" fill="#ffffff" opacity="0.7"/>

  <circle cx="600" cy="400" r="5" fill="#00FF57" opacity="0.6" filter="url(#fb-blur)"/>
  <circle cx="600" cy="400" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="1100" cy="490" r="5" fill="#00FF57" opacity="0.5" filter="url(#fb-blur)"/>
  <circle cx="1100" cy="490" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="1600" cy="280" r="5" fill="#00FF57" opacity="0.55" filter="url(#fb-blur)"/>
  <circle cx="1600" cy="280" r="2.5" fill="#ffffff" opacity="0.75"/>

  <!-- Thin secondary fiber lines -->
  <path d="M0,100 Q480,180 960,100 Q1440,20 1920,100" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>
  <path d="M0,130 Q480,210 960,130 Q1440,50 1920,130" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.08"/>
  <path d="M0,550 Q480,470 960,550 Q1440,600 1920,530" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>
  <path d="M0,570 Q480,490 960,570 Q1440,600 1920,550" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.08"/>

  <!-- Geometric nodes at intersections -->
  <rect x="470" y="235" width="12" height="12" rx="2" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.25" transform="rotate(45 476 241)"/>
  <rect x="954" y="294" width="12" height="12" rx="2" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.25" transform="rotate(45 960 300)"/>
  <rect x="1394" y="344" width="12" height="12" rx="2" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.25" transform="rotate(45 1400 350)"/>

  <!-- Scattered light particles -->
  <circle cx="150" cy="300" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="300" cy="450" r="1" fill="#00FF57" opacity="0.3"/>
  <circle cx="500" cy="120" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="700" cy="550" r="1" fill="#00FF57" opacity="0.3"/>
  <circle cx="1050" cy="80" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="1250" cy="550" r="1" fill="#00FF57" opacity="0.3"/>
  <circle cx="1500" cy="100" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="1750" cy="480" r="1" fill="#00FF57" opacity="0.3"/>
  <circle cx="1850" cy="150" r="1.5" fill="#ffffff" opacity="0.35"/>
</svg>
