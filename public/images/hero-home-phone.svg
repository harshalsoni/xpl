<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="hp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283238"/>
      <stop offset="100%" stop-color="#1C2428"/>
    </linearGradient>
    <radialGradient id="hp-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="600" fill="url(#hp-bg)"/>
  <ellipse cx="960" cy="300" rx="500" ry="350" fill="url(#hp-warm)"/>

  <!-- Subtle wave pattern background -->
  <path d="M0,150 Q240,120 480,150 Q720,180 960,150 Q1200,120 1440,150 Q1680,180 1920,150" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.06"/>
  <path d="M0,200 Q240,170 480,200 Q720,230 960,200 Q1200,170 1440,200 Q1680,230 1920,200" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>
  <path d="M0,450 Q240,420 480,450 Q720,480 960,450 Q1200,420 1440,450 Q1680,480 1920,450" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.06"/>
  <path d="M0,500 Q240,470 480,500 Q720,530 960,500 Q1200,470 1440,500 Q1680,530 1920,500" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>

  <!-- Phone handset icon - center -->
  <g transform="translate(960, 280)">
    <!-- Handset body -->
    <path d="M-40,-60 Q-50,-60 -55,-40 L-55,0 Q-55,10 -45,10 L-30,10 Q-20,10 -20,0 L-20,-20 Q-15,-50 0,-60 Q15,-50 20,-20 L20,0 Q20,10 30,10 L45,10 Q55,10 55,0 L55,-40 Q50,-60 40,-60" fill="none" stroke="#00FF57" stroke-width="2.5" opacity="0.4" transform="rotate(-30)"/>
  </g>

  <!-- Sound waves from phone - left side -->
  <path d="M870,250 Q850,280 870,310" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.25"/>
  <path d="M850,235 Q820,280 850,325" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.18"/>
  <path d="M830,220 Q790,280 830,340" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.12"/>

  <!-- Sound waves from phone - right side -->
  <path d="M1050,250 Q1070,280 1050,310" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.25"/>
  <path d="M1070,235 Q1100,280 1070,325" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.18"/>
  <path d="M1090,220 Q1130,280 1090,340" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.12"/>

  <!-- Home silhouette - left -->
  <g transform="translate(350, 350)" opacity="0.25">
    <rect x="0" y="30" width="100" height="70" fill="#00FF57" opacity="0.3"/>
    <polygon points="-10,30 50,0 110,30" fill="#00FF57" opacity="0.25"/>
    <rect x="38" y="55" width="24" height="45" fill="#283238" opacity="0.5"/>
    <rect x="10" y="45" width="18" height="18" fill="#283238" opacity="0.4"/>
    <rect x="72" y="45" width="18" height="18" fill="#283238" opacity="0.4"/>
  </g>

  <!-- Home silhouette - right -->
  <g transform="translate(1450, 340)" opacity="0.2">
    <rect x="0" y="30" width="110" height="75" fill="#00FF57" opacity="0.3"/>
    <polygon points="-10,30 55,0 120,30" fill="#00FF57" opacity="0.25"/>
    <rect x="42" y="55" width="26" height="50" fill="#283238" opacity="0.5"/>
    <rect x="12" y="48" width="20" height="20" fill="#283238" opacity="0.4"/>
    <rect x="78" y="48" width="20" height="20" fill="#283238" opacity="0.4"/>
  </g>

  <!-- Communication lines connecting homes to phone -->
  <line x1="450" y1="380" x2="900" y2="280" stroke="#00FF57" stroke-width="1" opacity="0.1" stroke-dasharray="6 4"/>
  <line x1="1500" y1="370" x2="1020" y2="280" stroke="#00FF57" stroke-width="1" opacity="0.1" stroke-dasharray="6 4"/>

  <!-- Dot pattern -->
  <circle cx="200" cy="200" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="250" cy="250" r="2" fill="#00FF57" opacity="0.15"/>
  <circle cx="300" cy="200" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="350" cy="250" r="2" fill="#00FF57" opacity="0.15"/>
  <circle cx="400" cy="200" r="2" fill="#00FF57" opacity="0.2"/>

  <circle cx="1520" cy="200" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="1570" cy="250" r="2" fill="#00FF57" opacity="0.15"/>
  <circle cx="1620" cy="200" r="2" fill="#00FF57" opacity="0.2"/>
  <circle cx="1670" cy="250" r="2" fill="#00FF57" opacity="0.15"/>
  <circle cx="1720" cy="200" r="2" fill="#00FF57" opacity="0.2"/>

  <!-- Signal rings -->
  <circle cx="960" cy="280" r="80" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.08"/>
  <circle cx="960" cy="280" r="120" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.06"/>
  <circle cx="960" cy="280" r="160" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.04"/>

  <!-- Decorative corners -->
  <path d="M30,30 L80,30 M30,30 L30,80" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.12"/>
  <path d="M1890,30 L1840,30 M1890,30 L1890,80" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.12"/>
  <path d="M30,570 L80,570 M30,570 L30,520" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.12"/>
  <path d="M1890,570 L1840,570 M1890,570 L1890,520" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.12"/>
</svg>
