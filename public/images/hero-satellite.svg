<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="sat-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2428"/>
      <stop offset="100%" stop-color="#283238"/>
    </linearGradient>
    <radialGradient id="sat-earth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#283238"/>
      <stop offset="80%" stop-color="#00FF57" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="sat-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="600" fill="url(#sat-bg)"/>

  <!-- Stars field -->
  <circle cx="80" cy="40" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="200" cy="100" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="320" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="450" cy="120" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="580" cy="30" r="1.5" fill="#ffffff" opacity="0.45"/>
  <circle cx="700" cy="80" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="830" cy="50" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="960" cy="90" r="1.5" fill="#ffffff" opacity="0.45"/>
  <circle cx="1100" cy="40" r="2" fill="#ffffff" opacity="0.55"/>
  <circle cx="1230" cy="110" r="1" fill="#ffffff" opacity="0.35"/>
  <circle cx="1360" cy="55" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="1500" cy="75" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="1630" cy="45" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="1760" cy="100" r="1.5" fill="#ffffff" opacity="0.45"/>
  <circle cx="1880" cy="60" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="140" cy="160" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="400" cy="180" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="650" cy="150" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="1050" cy="170" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="1300" cy="160" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="1600" cy="150" r="1.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="1850" cy="170" r="1" fill="#ffffff" opacity="0.3"/>

  <!-- Earth curvature at bottom -->
  <ellipse cx="960" cy="900" rx="1200" ry="500" fill="url(#sat-earth)"/>
  <ellipse cx="960" cy="900" rx="1200" ry="500" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.15"/>
  <!-- Atmosphere glow -->
  <ellipse cx="960" cy="900" rx="1220" ry="515" fill="none" stroke="#00FF57" stroke-width="4" opacity="0.05"/>
  <ellipse cx="960" cy="900" rx="1240" ry="530" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.03"/>

  <!-- Satellite body -->
  <g transform="translate(700, 180) rotate(-15)">
    <!-- Main body -->
    <rect x="-20" y="-15" width="40" height="30" rx="4" fill="#283238" stroke="#00FF57" stroke-width="1.5" opacity="0.7"/>
    <!-- Solar panels -->
    <rect x="-90" y="-10" width="65" height="20" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.5"/>
    <rect x="25" y="-10" width="65" height="20" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.5"/>
    <!-- Panel grid lines -->
    <line x1="-90" y1="0" x2="-25" y2="0" stroke="#00FF57" stroke-width="0.5" opacity="0.3"/>
    <line x1="-57" y1="-10" x2="-57" y2="10" stroke="#00FF57" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="0" x2="90" y2="0" stroke="#00FF57" stroke-width="0.5" opacity="0.3"/>
    <line x1="57" y1="-10" x2="57" y2="10" stroke="#00FF57" stroke-width="0.5" opacity="0.3"/>
    <!-- Antenna -->
    <line x1="0" y1="15" x2="0" y2="35" stroke="#00FF57" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="37" r="3" fill="#00FF57" opacity="0.4"/>
  </g>

  <!-- Signal beam from satellite to earth -->
  <polygon points="700,220 600,500 800,500" fill="url(#sat-beam)" opacity="0.08"/>
  <line x1="700" y1="220" x2="600" y2="500" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>
  <line x1="700" y1="220" x2="800" y2="500" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>

  <!-- Satellite dish on ground -->
  <path d="M680,495 Q700,470 720,495" fill="none" stroke="#00FF57" stroke-width="2" opacity="0.35"/>
  <line x1="700" y1="480" x2="700" y2="510" stroke="#00FF57" stroke-width="1.5" opacity="0.3"/>
  <rect x="692" y="510" width="16" height="3" fill="#00FF57" opacity="0.25"/>

  <!-- Orbital arcs -->
  <ellipse cx="960" cy="300" rx="800" ry="200" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.06" stroke-dasharray="10 8" transform="rotate(-10 960 300)"/>
  <ellipse cx="960" cy="300" rx="600" ry="350" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.04" stroke-dasharray="8 10" transform="rotate(15 960 300)"/>
  <ellipse cx="960" cy="300" rx="900" ry="150" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.05" stroke-dasharray="12 8" transform="rotate(-5 960 300)"/>

  <!-- Second smaller satellite -->
  <g transform="translate(1350, 130) rotate(20)">
    <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#283238" stroke="#00FF57" stroke-width="1" opacity="0.5"/>
    <rect x="-40" y="-5" width="28" height="10" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.3"/>
    <rect x="12" y="-5" width="28" height="10" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Signal rings around dish -->
  <circle cx="700" cy="490" r="25" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.12"/>
  <circle cx="700" cy="490" r="40" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.08"/>
  <circle cx="700" cy="490" r="55" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.05"/>

  <!-- Ground line -->
  <path d="M0,520 Q480,510 960,525 Q1440,540 1920,515" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.1"/>
</svg>
