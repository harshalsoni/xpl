<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="rt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283238"/>
      <stop offset="100%" stop-color="#1C2428"/>
    </linearGradient>
    <radialGradient id="rt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rt-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF57" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="600" fill="url(#rt-bg)"/>
  <ellipse cx="960" cy="320" rx="500" ry="300" fill="url(#rt-glow)"/>

  <!-- Tech circuit background pattern -->
  <path d="M200,100 L300,100 L300,200 L400,200 L400,150" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.08"/>
  <path d="M1520,450 L1620,450 L1620,350 L1720,350 L1720,400" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.08"/>
  <circle cx="300" cy="100" r="3" fill="#00FF57" opacity="0.12"/>
  <circle cx="400" cy="200" r="3" fill="#00FF57" opacity="0.12"/>
  <circle cx="1620" cy="450" r="3" fill="#00FF57" opacity="0.12"/>
  <circle cx="1720" cy="350" r="3" fill="#00FF57" opacity="0.12"/>

  <!-- Router body - main -->
  <rect x="830" y="300" width="260" height="60" rx="8" fill="#283238" stroke="#00FF57" stroke-width="2" opacity="0.5"/>
  <!-- Router top surface -->
  <rect x="830" y="300" width="260" height="30" rx="8" fill="url(#rt-shine)" opacity="0.5"/>
  <!-- Router base/stand -->
  <rect x="870" y="360" width="180" height="40" rx="5" fill="#283238" stroke="#00FF57" stroke-width="1.5" opacity="0.4"/>

  <!-- LED indicators -->
  <circle cx="870" cy="325" r="4" fill="#00FF57" opacity="0.6"/>
  <circle cx="890" cy="325" r="4" fill="#00FF57" opacity="0.45"/>
  <circle cx="910" cy="325" r="4" fill="#00FF57" opacity="0.5"/>
  <circle cx="930" cy="325" r="4" fill="#00FF57" opacity="0.35"/>

  <!-- Ventilation lines -->
  <line x1="980" y1="312" x2="1070" y2="312" stroke="#00FF57" stroke-width="0.5" opacity="0.15"/>
  <line x1="980" y1="318" x2="1070" y2="318" stroke="#00FF57" stroke-width="0.5" opacity="0.15"/>
  <line x1="980" y1="324" x2="1070" y2="324" stroke="#00FF57" stroke-width="0.5" opacity="0.15"/>
  <line x1="980" y1="330" x2="1070" y2="330" stroke="#00FF57" stroke-width="0.5" opacity="0.15"/>
  <line x1="980" y1="336" x2="1070" y2="336" stroke="#00FF57" stroke-width="0.5" opacity="0.15"/>

  <!-- Left antenna -->
  <line x1="880" y1="300" x2="850" y2="180" stroke="#00FF57" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <circle cx="850" cy="178" r="5" fill="#00FF57" opacity="0.45"/>
  <!-- Right antenna -->
  <line x1="1040" y1="300" x2="1070" y2="180" stroke="#00FF57" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <circle cx="1070" cy="178" r="5" fill="#00FF57" opacity="0.45"/>

  <!-- Signal waves from left antenna -->
  <path d="M830,165 Q810,140 830,115" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.25"/>
  <path d="M815,175 Q785,140 815,105" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.18"/>
  <path d="M800,185 Q760,140 800,95" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>

  <!-- Signal waves from right antenna -->
  <path d="M1090,165 Q1110,140 1090,115" fill="none" stroke="#00FF57" stroke-width="1.5" opacity="0.25"/>
  <path d="M1105,175 Q1135,140 1105,105" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.18"/>
  <path d="M1120,185 Q1160,140 1120,95" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.12"/>

  <!-- Signal propagation from router -->
  <circle cx="960" cy="300" r="100" fill="none" stroke="#00FF57" stroke-width="1" opacity="0.08" stroke-dasharray="6 4"/>
  <circle cx="960" cy="300" r="160" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.06" stroke-dasharray="8 5"/>
  <circle cx="960" cy="300" r="220" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.04" stroke-dasharray="10 6"/>
  <circle cx="960" cy="300" r="300" fill="none" stroke="#00FF57" stroke-width="0.5" opacity="0.03" stroke-dasharray="12 8"/>

  <!-- Ethernet ports on back -->
  <rect x="870" y="370" width="12" height="8" rx="1" fill="#00FF57" opacity="0.15"/>
  <rect x="890" y="370" width="12" height="8" rx="1" fill="#00FF57" opacity="0.12"/>
  <rect x="910" y="370" width="12" height="8" rx="1" fill="#00FF57" opacity="0.15"/>
  <rect x="930" y="370" width="12" height="8" rx="1" fill="#00FF57" opacity="0.12"/>

  <!-- Data flow particles -->
  <circle cx="750" cy="250" r="2.5" fill="#00FF57" opacity="0.35"/>
  <circle cx="680" cy="200" r="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="600" cy="280" r="2.5" fill="#00FF57" opacity="0.3"/>
  <circle cx="1170" cy="250" r="2.5" fill="#00FF57" opacity="0.35"/>
  <circle cx="1240" cy="200" r="2" fill="#ffffff" opacity="0.25"/>
  <circle cx="1320" cy="280" r="2.5" fill="#00FF57" opacity="0.3"/>

  <!-- Speed indicator lines -->
  <rect x="400" y="290" width="150" height="1.5" fill="#00FF57" opacity="0.08"/>
  <rect x="350" y="310" width="180" height="1" fill="#00FF57" opacity="0.06"/>
  <rect x="1370" y="290" width="150" height="1.5" fill="#00FF57" opacity="0.08"/>
  <rect x="1400" y="310" width="180" height="1" fill="#00FF57" opacity="0.06"/>

  <!-- Decorative tech elements -->
  <polygon points="300,400 315,385 330,400 330,430 315,445 300,430" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.1"/>
  <polygon points="1590,170 1605,155 1620,170 1620,200 1605,215 1590,200" fill="none" stroke="#00FF57" stroke-width="0.8" opacity="0.1"/>

  <!-- Bottom surface reflection -->
  <rect x="830" y="410" width="260" height="40" rx="4" fill="#00FF57" opacity="0.02"/>
</svg>
